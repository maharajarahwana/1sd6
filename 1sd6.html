<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1sd6</title>

<style>

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        width: 100%;
        max-width: 500px;
        height: auto;
    }

</style>
</head>

<body>

<canvas id="canvas" width="500" height="300"></canvas>

<script>

// =====================================================
// 18 NADA
// =====================================================

const nada = [

    { nama:"E2", frekuensi:82.41 },
    { nama:"F2", frekuensi:87.31 },
    { nama:"G2", frekuensi:98.00 },
    { nama:"A2", frekuensi:110.00 },
    { nama:"B2", frekuensi:123.47 },
    { nama:"C3", frekuensi:130.81 },
    { nama:"D3", frekuensi:146.83 },

    { nama:"E3", frekuensi:164.81 },
    { nama:"F3", frekuensi:174.61 },
    { nama:"G3", frekuensi:196.00 },
    { nama:"A3", frekuensi:220.00 },
    { nama:"B3", frekuensi:246.94 },

    { nama:"C4", frekuensi:261.63 },
    { nama:"D4", frekuensi:293.66 },
    { nama:"E4", frekuensi:329.63 },
    { nama:"F4", frekuensi:349.23 },
    { nama:"G4", frekuensi:392.00 },
    { nama:"A4", frekuensi:440.00 }

];


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let target;

let notSebelumnya = null;


// =====================================================
// PILIH NOT RANDOM
// =====================================================

function pilihNot() {

    let pilihan;

    do {

        pilihan =
            nada[
                Math.floor(
                    Math.random() * nada.length
                )
            ];

    } while (
        nada.length > 1 &&
        pilihan.nama === notSebelumnya
    );


    target = pilihan;

    notSebelumnya =
        target.nama;

    gambarNot();

}


// =====================================================
// GAMBAR NOT
// =====================================================

function gambarNot() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =================================================
    // PARANADA
    // =================================================

    const x1 = 100;
    const x2 = 440;

    const jarak = 30;

    const garisTengah = 150;


    for (
        let i = -2;
        i <= 2;
        i++
    ) {

        const y =
            garisTengah +
            i * jarak;


        ctx.beginPath();

        ctx.moveTo(
            x1,
            y
        );

        ctx.lineTo(
            x2,
            y
        );

        ctx.strokeStyle =
            "black";

        ctx.lineWidth =
            3;

        ctx.stroke();

    }


    // =================================================
    // KUNCI G
    // =================================================

    ctx.font =
        "115px serif";

    ctx.fillStyle =
        "black";


    ctx.fillText(
        "𝄞",
        35,
        185
    );


    // =================================================
    // POSISI 18 NOT
    // =================================================

    const posisi = {

        "E2": 285,
        "F2": 270,
        "G2": 255,
        "A2": 240,
        "B2": 225,
        "C3": 210,
        "D3": 195,

        "E3": 180,
        "F3": 165,
        "G3": 150,
        "A3": 135,
        "B3": 120,

        "C4": 105,
        "D4": 90,
        "E4": 75,
        "F4": 60,
        "G4": 45,
        "A4": 30

    };


    const y =
        posisi[target.nama];

    const x = 270;


    // =================================================
    // GARIS BANTU
    // =================================================

    let garisBantu = [];


    // E2
    if (
        target.nama === "E2"
    ) {

        garisBantu =
            [210, 240, 270];

    }


    // F2
    else if (
        target.nama === "F2"
    ) {

        garisBantu =
            [210, 240, 270];

    }


    // G2
    else if (
        target.nama === "G2"
    ) {

        garisBantu =
            [210, 240];

    }


    // A2
    else if (
        target.nama === "A2"
    ) {

        garisBantu =
            [210, 240];

    }


    // B2
    else if (
        target.nama === "B2"
    ) {

        garisBantu =
            [210];

    }


    // C3
    else if (
        target.nama === "C3"
    ) {

        garisBantu =
            [210];

    }


    // D3
    else if (
        target.nama === "D3"
    ) {

        garisBantu =
            [];

    }


    // E3 sampai D4
    else if (
        target.nama === "E3" ||
        target.nama === "F3" ||
        target.nama === "G3" ||
        target.nama === "A3" ||
        target.nama === "B3" ||
        target.nama === "C4" ||
        target.nama === "D4"
    ) {

        garisBantu =
            [];

    }


    // E4
    else if (
        target.nama === "E4"
    ) {

        garisBantu =
            [];

    }


    // F4
    else if (
        target.nama === "F4"
    ) {

        garisBantu =
            [60];

    }


    // G4
    else if (
        target.nama === "G4"
    ) {

        garisBantu =
            [60];

    }


    // A4
    else if (
        target.nama === "A4"
    ) {

        garisBantu =
            [30];

    }


    // =================================================
    // GAMBAR GARIS BANTU
    // =================================================

    garisBantu.forEach(
        function(gy) {

            ctx.beginPath();

            ctx.moveTo(
                x - 35,
                gy
            );

            ctx.lineTo(
                x + 35,
                gy
            );

            ctx.strokeStyle =
                "black";

            ctx.lineWidth =
                3;

            ctx.stroke();

        }
    );


    // =================================================
    // KEPALA NOT
    // =================================================

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        17,
        12,
        -0.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // =================================================
    // BATANG NOT
    // =================================================

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y
    );

    ctx.lineTo(
        x + 15,
        y - 75
    );

    ctx.lineWidth =
        4;

    ctx.stroke();

}


// =====================================================
// AUDIO
// =====================================================

let audioContext;
let analyser;
let microphone;
let buffer;


async function mulaiMikrofon() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        microphone =
            audioContext
            .createMediaStreamSource(
                stream
            );


        analyser =
            audioContext
            .createAnalyser();


        analyser.fftSize =
            4096;

        analyser.smoothingTimeConstant =
            0;


        microphone.connect(
            analyser
        );


        buffer =
            new Float32Array(
                analyser.fftSize
            );


        deteksiNada();

    }

    catch (error) {

        console.log(error);

        document.body.innerHTML =
            "<h2>Izinkan akses mikrofon</h2>";

    }

}


// =====================================================
// DETEKSI NADA
// =====================================================

function deteksiNada() {

    analyser.getFloatTimeDomainData(
        buffer
    );


    const frekuensi =
        cariFrekuensi(
            buffer,
            audioContext.sampleRate
        );


    if (
        frekuensi > 0
    ) {

        cekNada(
            frekuensi
        );

    }


    requestAnimationFrame(
        deteksiNada
    );

}


// =====================================================
// CARI FREKUENSI
// NORMALIZED AUTOCORRELATION
// =====================================================

function cariFrekuensi(
    buffer,
    sampleRate
) {

    // -----------------------------------------------
    // RMS
    // -----------------------------------------------

    let rms = 0;

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];

    }


    rms =
        Math.sqrt(
            rms /
            buffer.length
        );


    if (
        rms < 0.015
    ) {

        return -1;

    }


    // -----------------------------------------------
    // Hilangkan DC offset
    // -----------------------------------------------

    let rataRata = 0;

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rataRata +=
            buffer[i];

    }


    rataRata /=
        buffer.length;


    const data =
        new Float32Array(
            buffer.length
        );


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        data[i] =
            buffer[i] -
            rataRata;

    }


    // -----------------------------------------------
    // Rentang nada gitar
    //
    // 70 Hz sampai 470 Hz
    // -----------------------------------------------

    const minFreq = 70;
    const maxFreq = 470;


    const minLag =
        Math.floor(
            sampleRate /
            maxFreq
        );


    const maxLag =
        Math.floor(
            sampleRate /
            minFreq
        );


    let bestLag =
        -1;

    let bestCorrelation =
        -Infinity;


    // -----------------------------------------------
    // NORMALIZED AUTOCORRELATION
    // -----------------------------------------------

    for (
        let lag = minLag;
        lag <= maxLag;
        lag++
    ) {

        let sumXY = 0;
        let sumX2 = 0;
        let sumY2 = 0;


        for (
            let i = 0;
            i < data.length - lag;
            i++
        ) {

            const x =
                data[i];

            const y =
                data[i + lag];


            sumXY +=
                x * y;

            sumX2 +=
                x * x;

            sumY2 +=
                y * y;

        }


        if (
            sumX2 === 0 ||
            sumY2 === 0
        ) {

            continue;

        }


        const correlation =
            sumXY /
            Math.sqrt(
                sumX2 *
                sumY2
            );


        if (
            correlation >
            bestCorrelation
        ) {

            bestCorrelation =
                correlation;

            bestLag =
                lag;

        }

    }


    if (
        bestLag === -1 ||
        bestCorrelation < 0.50
    ) {

        return -1;

    }


    // -----------------------------------------------
    // INTERPOLASI PARABOLA
    // Agar frekuensi lebih akurat
    // -----------------------------------------------

    let refinedLag =
        bestLag;


    if (
        bestLag > minLag &&
        bestLag < maxLag
    ) {

        function correlationPadaLag(lag) {

            let sumXY = 0;
            let sumX2 = 0;
            let sumY2 = 0;


            for (
                let i = 0;
                i < data.length - lag;
                i++
            ) {

                const x =
                    data[i];

                const y =
                    data[i + lag];


                sumXY +=
                    x * y;

                sumX2 +=
                    x * x;

                sumY2 +=
                    y * y;

            }


            if (
                sumX2 === 0 ||
                sumY2 === 0
            ) {

                return 0;

            }


            return (
                sumXY /
                Math.sqrt(
                    sumX2 *
                    sumY2
                )
            );

        }


        const y1 =
            correlationPadaLag(
                bestLag - 1
            );

        const y2 =
            correlationPadaLag(
                bestLag
            );

        const y3 =
            correlationPadaLag(
                bestLag + 1
            );


        const denominator =
            y1 -
            2 * y2 +
            y3;


        if (
            denominator !== 0
        ) {

            const adjustment =
                0.5 *
                (y1 - y3) /
                denominator;


            refinedLag =
                bestLag +
                adjustment;

        }

    }


    return (
        sampleRate /
        refinedLag
    );

}


// =====================================================
// CEK NADA
// =====================================================

let waktuTerakhir =
    0;


function cekNada(freq) {

    const sekarang =
        Date.now();


    // -----------------------------------------------
    // Debounce
    // -----------------------------------------------

    if (
        sekarang -
        waktuTerakhir <
        500
    ) {

        return;

    }


    let terdekat =
        null;

    let selisihTerkecil =
        Infinity;


    // -----------------------------------------------
    // Cari frekuensi TERDEKAT
    // -----------------------------------------------

    for (
        const n of nada
    ) {

        const selisih =
            Math.abs(
                freq -
                n.frekuensi
            );


        if (
            selisih <
            selisihTerkecil
        ) {

            selisihTerkecil =
                selisih;

            terdekat =
                n;

        }

    }


    // -----------------------------------------------
    // Toleransi 2,5%
    // -----------------------------------------------

    if (
        terdekat &&
        selisihTerkecil /
        terdekat.frekuensi <
        0.025
    ) {

        waktuTerakhir =
            sekarang;


        // -------------------------------------------
        // HANYA jika frekuensi benar-benar
        // sesuai dengan target
        // -------------------------------------------

        if (
            terdekat.nama ===
            target.nama
        ) {

            pilihNot();

        }

    }

}


// =====================================================
// MULAI OTOMATIS
// =====================================================

pilihNot();

mulaiMikrofon();

</script>

</body>
</html>
