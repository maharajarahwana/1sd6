<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diatonik C - 18 Posisi</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        width: 100%;
        max-width: 500px;
        height: auto;
    }
</style>
</head>

<body>

<canvas id="canvas" width="500" height="300"></canvas>

<script>

// =====================================================
// DAFTAR NADA GITAR
// SENAR 6 FRET 0 SAMPAI SENAR 1 FRET 5
// =====================================================

const nada = [

    // SENAR 6
    { nama:"E", senar:6, fret:0, frekuensi:82.41 },
    { nama:"F", senar:6, fret:1, frekuensi:87.31 },
    { nama:"G", senar:6, fret:3, frekuensi:98.00 },
    { nama:"A", senar:6, fret:5, frekuensi:110.00 },

    // SENAR 5
    { nama:"A", senar:5, fret:0, frekuensi:110.00 },
    { nama:"B", senar:5, fret:2, frekuensi:123.47 },
    { nama:"C", senar:5, fret:3, frekuensi:130.81 },
    { nama:"D", senar:5, fret:5, frekuensi:146.83 },

    // SENAR 4
    { nama:"D", senar:4, fret:0, frekuensi:146.83 },
    { nama:"E", senar:4, fret:2, frekuensi:164.81 },
    { nama:"F", senar:4, fret:3, frekuensi:174.61 },
    { nama:"G", senar:4, fret:5, frekuensi:196.00 },

    // SENAR 3
    { nama:"G", senar:3, fret:0, frekuensi:196.00 },
    { nama:"A", senar:3, fret:2, frekuensi:220.00 },
    { nama:"B", senar:3, fret:4, frekuensi:246.94 },
    { nama:"C", senar:3, fret:5, frekuensi:261.63 },

    // SENAR 2
    { nama:"B", senar:2, fret:0, frekuensi:246.94 },
    { nama:"C", senar:2, fret:1, frekuensi:261.63 },
    { nama:"D", senar:2, fret:3, frekuensi:293.66 },
    { nama:"E", senar:2, fret:5, frekuensi:329.63 },

    // SENAR 1
    { nama:"E", senar:1, fret:0, frekuensi:329.63 },
    { nama:"F", senar:1, fret:1, frekuensi:349.23 },
    { nama:"G", senar:1, fret:3, frekuensi:392.00 },
    { nama:"A", senar:1, fret:5, frekuensi:440.00 }

];


// =====================================================
// CANVAS
// =====================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let target;
let notSebelumnya = null;


// =====================================================
// 18 POSISI NOT
//
// E = paling bawah
// A = paling atas
//
// 18 posisi:
//
// E F G A B C D E F G A B C D E F G A
//
// =====================================================

const posisiNot = [

    { nama:"E", oktaf:2, y:285 },
    { nama:"F", oktaf:2, y:270 },
    { nama:"G", oktaf:2, y:255 },
    { nama:"A", oktaf:2, y:240 },
    { nama:"B", oktaf:2, y:225 },
    { nama:"C", oktaf:3, y:210 },
    { nama:"D", oktaf:3, y:195 },

    { nama:"E", oktaf:3, y:180 },
    { nama:"F", oktaf:3, y:165 },
    { nama:"G", oktaf:3, y:150 },
    { nama:"A", oktaf:3, y:135 },
    { nama:"B", oktaf:3, y:120 },

    { nama:"C", oktaf:4, y:105 },
    { nama:"D", oktaf:4, y:90 },
    { nama:"E", oktaf:4, y:75 },
    { nama:"F", oktaf:4, y:60 },
    { nama:"G", oktaf:4, y:45 },
    { nama:"A", oktaf:4, y:30 }

];


// =====================================================
// PILIH POSISI RANDOM
// =====================================================

function pilihNot() {

    let pilihan;

    do {

        pilihan =
            nada[
                Math.floor(
                    Math.random() * nada.length
                )
            ];

    } while (
        nada.length > 1 &&
        pilihan === notSebelumnya
    );

    target = pilihan;

    notSebelumnya = target;

    gambarNot();
}


// =====================================================
// CARI POSISI VISUAL
// BERDASARKAN NAMA + FREKUENSI
// =====================================================

function cariPosisiVisual() {

    let terdekat = null;
    let selisihTerkecil = Infinity;

    for (const p of posisiNot) {

        const frekuensiPosisi = {

            "E2":82.41,
            "F2":87.31,
            "G2":98.00,
            "A2":110.00,
            "B2":123.47,
            "C3":130.81,
            "D3":146.83,

            "E3":164.81,
            "F3":174.61,
            "G3":196.00,
            "A3":220.00,
            "B3":246.94,
            "C4":261.63,
            "D4":293.66,

            "E4":329.63,
            "F4":349.23,
            "G4":392.00,
            "A4":440.00

        };

        const key =
            p.nama + p.oktaf;

        const freq =
            frekuensiPosisi[key];

        const selisih =
            Math.abs(
                target.frekuensi - freq
            );

        if (selisih < selisihTerkecil) {

            selisihTerkecil = selisih;
            terdekat = p;

        }

    }

    return terdekat;
}


// =====================================================
// GAMBAR NOT
// =====================================================

function gambarNot() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =================================================
    // PARANADA
    // =================================================

    const x1 = 100;
    const x2 = 440;

    const jarak = 30;
    const garisTengah = 120;


    for (
        let i = -2;
        i <= 2;
        i++
    ) {

        const y =
            garisTengah +
            i * jarak;

        ctx.beginPath();

        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);

        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;

        ctx.stroke();

    }


    // =================================================
    // KUNCI G
    // =================================================

    ctx.font = "115px serif";
    ctx.fillStyle = "black";

    ctx.fillText(
        "𝄞",
        35,
        155
    );


    // =================================================
    // POSISI NOT
    // =================================================

    const posisi =
        cariPosisiVisual();

    const y =
        posisi.y;

    const x = 270;


    // =================================================
    // GARIS BANTU
    // =================================================

    let garisBantu = [];


    // -------------------------------------------------
    // GARIS BAWAH
    // -------------------------------------------------

    if (y === 270) {

        garisBantu = [270];

    }

    else if (y === 255) {

        garisBantu = [270];

    }

    else if (y === 240) {

        garisBantu = [240, 270];

    }

    else if (y === 225) {

        garisBantu = [240, 270];

    }

    else if (y === 210) {

        garisBantu = [210, 240, 270];

    }

    else if (y === 195) {

        garisBantu = [210, 240, 270];

    }


    // -------------------------------------------------
    // GARIS ATAS
    // -------------------------------------------------

    else if (y === 45) {

        garisBantu = [30];

    }

    else if (y === 30) {

        garisBantu = [30];

    }


    // =================================================
    // GAMBAR GARIS BANTU
    // =================================================

    garisBantu.forEach(function(gy) {

        ctx.beginPath();

        ctx.moveTo(
            x - 35,
            gy
        );

        ctx.lineTo(
            x + 35,
            gy
        );

        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;

        ctx.stroke();

    });


    // =================================================
    // KEPALA NOT
    // =================================================

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        17,
        12,
        -0.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // =================================================
    // BATANG NOT
    // =================================================

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y
    );

    ctx.lineTo(
        x + 15,
        y - 75
    );

    ctx.lineWidth = 4;

    ctx.stroke();

}


// =====================================================
// AUDIO
// =====================================================

let audioContext;
let analyser;
let microphone;
let buffer;


async function mulaiMikrofon() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        microphone =
            audioContext
            .createMediaStreamSource(
                stream
            );


        analyser =
            audioContext
            .createAnalyser();


        analyser.fftSize = 4096;


        microphone.connect(
            analyser
        );


        buffer =
            new Float32Array(
                analyser.fftSize
            );


        deteksiNada();

    }

    catch (error) {

        console.log(error);

        document.body.innerHTML =
            "<h2>Izinkan akses mikrofon</h2>";

    }

}


// =====================================================
// DETEKSI NADA
// =====================================================

function deteksiNada() {

    analyser.getFloatTimeDomainData(
        buffer
    );


    const frekuensi =
        cariFrekuensi(
            buffer,
            audioContext.sampleRate
        );


    if (frekuensi > 0) {

        cekNada(frekuensi);

    }


    requestAnimationFrame(
        deteksiNada
    );

}


// =====================================================
// CARI FREKUENSI
// =====================================================

function cariFrekuensi(
    buffer,
    sampleRate
) {

    let rms = 0;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];

    }


    rms =
        Math.sqrt(
            rms /
            buffer.length
        );


    if (rms < 0.015) {

        return -1;

    }


    let bestOffset = -1;
    let bestCorrelation = 0;


    for (
        let offset = 20;
        offset < 1000;
        offset++
    ) {

        let correlation = 0;


        for (
            let i = 0;
            i < buffer.length - offset;
            i++
        ) {

            correlation +=
                buffer[i] *
                buffer[i + offset];

        }


        correlation /=
            buffer.length - offset;


        if (
            correlation >
            bestCorrelation
        ) {

            bestCorrelation =
                correlation;

            bestOffset =
                offset;

        }

    }


    if (bestOffset === -1) {

        return -1;

    }


    return (
        sampleRate /
        bestOffset
    );

}


// =====================================================
// CEK NADA
// =====================================================

let waktuTerakhir = 0;


function cekNada(freq) {

    const sekarang =
        Date.now();


    if (
        sekarang -
        waktuTerakhir <
        500
    ) {

        return;

    }


    let terdekat = null;
    let selisihTerkecil = Infinity;


    for (const n of nada) {

        const selisih =
            Math.abs(
                freq -
                n.frekuensi
            );


        if (
            selisih <
            selisihTerkecil
        ) {

            selisihTerkecil =
                selisih;

            terdekat = n;

        }

    }


    // =================================================
    // TOLERANSI 2,5%
    // =================================================

    if (
        terdekat &&
        selisihTerkecil /
        terdekat.frekuensi <
        0.025
    ) {

        waktuTerakhir =
            sekarang;


        // JIKA BENAR
        if (
            terdekat.frekuensi ===
            target.frekuensi
        ) {

            pilihNot();

        }

        // JIKA SALAH
        else {

            // Not tetap.

        }

    }

}


// =====================================================
// MULAI
// =====================================================

pilihNot();

mulaiMikrofon();

</script>

</body>
</html>
