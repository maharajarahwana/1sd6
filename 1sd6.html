<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1sd6</title>

<style>

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        width: 100%;
        max-width: 500px;
        height: auto;
    }

</style>
</head>

<body>

<canvas id="canvas" width="500" height="300"></canvas>

<script>

// =====================================================
// 18 NADA / 18 GAMBAR NOT
//
// E2  = Senar 6 fret 0
// F2  = Senar 6 fret 1
// G2  = Senar 6 fret 3
// A2  = Senar 6 fret 5 / Senar 5 fret 0
// B2  = Senar 5 fret 2
// C3  = Senar 5 fret 3
// D3  = Senar 5 fret 5 / Senar 4 fret 0
// E3  = Senar 4 fret 2
// F3  = Senar 4 fret 3
// G3  = Senar 4 fret 5 / Senar 3 fret 0
// A3  = Senar 3 fret 2
// B3  = Senar 3 fret 4 / Senar 2 fret 0
// C4  = Senar 3 fret 5 / Senar 2 fret 1
// D4  = Senar 2 fret 3
// E4  = Senar 2 fret 5 / Senar 1 fret 0
// F4  = Senar 1 fret 1
// G4  = Senar 1 fret 3
// A4  = Senar 1 fret 5
//
// =====================================================

const nada = [

    {
        nama: "E2",
        frekuensi: 82.41
    },

    {
        nama: "F2",
        frekuensi: 87.31
    },

    {
        nama: "G2",
        frekuensi: 98.00
    },

    {
        nama: "A2",
        frekuensi: 110.00
    },

    {
        nama: "B2",
        frekuensi: 123.47
    },

    {
        nama: "C3",
        frekuensi: 130.81
    },

    {
        nama: "D3",
        frekuensi: 146.83
    },

    {
        nama: "E3",
        frekuensi: 164.81
    },

    {
        nama: "F3",
        frekuensi: 174.61
    },

    {
        nama: "G3",
        frekuensi: 196.00
    },

    {
        nama: "A3",
        frekuensi: 220.00
    },

    {
        nama: "B3",
        frekuensi: 246.94
    },

    {
        nama: "C4",
        frekuensi: 261.63
    },

    {
        nama: "D4",
        frekuensi: 293.66
    },

    {
        nama: "E4",
        frekuensi: 329.63
    },

    {
        nama: "F4",
        frekuensi: 349.23
    },

    {
        nama: "G4",
        frekuensi: 392.00
    },

    {
        nama: "A4",
        frekuensi: 440.00
    }

];


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let target;

let notSebelumnya = null;


// =====================================================
// PILIH NOT RANDOM
// =====================================================

function pilihNot() {

    let pilihan;

    do {

        pilihan =
            nada[
                Math.floor(
                    Math.random() * nada.length
                )
            ];

    } while (

        nada.length > 1 &&
        pilihan.nama === notSebelumnya

    );


    target = pilihan;

    notSebelumnya =
        target.nama;

    gambarNot();

}


// =====================================================
// GAMBAR NOT
// =====================================================

function gambarNot() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =================================================
    // PARANADA
    // =================================================

    const x1 = 100;
    const x2 = 440;

    const jarak = 30;

    const garisTengah = 150;


    for (
        let i = -2;
        i <= 2;
        i++
    ) {

        const y =
            garisTengah +
            i * jarak;


        ctx.beginPath();

        ctx.moveTo(
            x1,
            y
        );

        ctx.lineTo(
            x2,
            y
        );


        ctx.strokeStyle =
            "black";

        ctx.lineWidth =
            3;

        ctx.stroke();

    }


    // =================================================
    // KUNCI G
    // =================================================

    ctx.font =
        "115px serif";

    ctx.fillStyle =
        "black";


    ctx.fillText(
        "𝄞",
        35,
        185
    );


    // =================================================
    // POSISI 18 NOT
    // =================================================
    //
    // E2 = 285
    // F2 = 270
    // G2 = 255
    // A2 = 240
    // B2 = 225
    // C3 = 210
    // D3 = 195
    // E3 = 180
    // F3 = 165
    // G3 = 150
    // A3 = 135
    // B3 = 120
    // C4 = 105
    // D4 = 90
    // E4 = 75
    // F4 = 60
    // G4 = 45
    // A4 = 30
    //
    // =================================================

    const posisi = {

        "E2": 285,
        "F2": 270,
        "G2": 255,
        "A2": 240,
        "B2": 225,
        "C3": 210,
        "D3": 195,

        "E3": 180,
        "F3": 165,
        "G3": 150,
        "A3": 135,
        "B3": 120,

        "C4": 105,
        "D4": 90,
        "E4": 75,
        "F4": 60,
        "G4": 45,
        "A4": 30

    };


    const y =
        posisi[target.nama];

    const x = 270;


    // =================================================
    // GARIS BANTU
    // =================================================

    let garisBantu = [];


    // -------------------------------------------------
    // NOT DI BAWAH PARANADA
    // -------------------------------------------------

    if (
        target.nama === "E2"
    ) {

        // E2:
        // 3 garis bantu bawah
        //
        // F - A - C

        garisBantu =
            [210, 240, 270];

    }

    else if (
        target.nama === "F2"
    ) {

        // F2:
        // 3 garis bantu
        // F - A - C

        garisBantu =
            [210, 240, 270];

    }

    else if (
        target.nama === "G2"
    ) {

        // G2:
        // A dan C

        garisBantu =
            [210, 240];

    }

    else if (
        target.nama === "A2"
    ) {

        // A2:
        // A dan C

        garisBantu =
            [210, 240];

    }

    else if (
        target.nama === "B2"
    ) {

        // B2:
        // C

        garisBantu =
            [210];

    }

    else if (
        target.nama === "C3"
    ) {

        // C3:
        // 1 garis C

        garisBantu =
            [210];

    }

    else if (
        target.nama === "D3"
    ) {

        // D3:
        // tidak ada garis bantu

        garisBantu =
            [];

    }


    // -------------------------------------------------
    // NOT DI DALAM PARANADA
    // -------------------------------------------------

    else if (
        target.nama === "E3"
    ) {

        // E3 = garis bawah paranada

        garisBantu =
            [];

    }

    else if (
        target.nama === "F3"
    ) {

        // F3 = spasi

        garisBantu =
            [];

    }

    else if (
        target.nama === "G3"
    ) {

        // G3 = garis

        garisBantu =
            [];

    }

    else if (
        target.nama === "A3"
    ) {

        // A3 = spasi

        garisBantu =
            [];

    }

    else if (
        target.nama === "B3"
    ) {

        // B3 = garis tengah

        garisBantu =
            [];

    }

    else if (
        target.nama === "C4"
    ) {

        // C4 = spasi atas

        garisBantu =
            [];

    }

    else if (
        target.nama === "D4"
    ) {

        // D4 = garis atas

        garisBantu =
            [];

    }


    // -------------------------------------------------
    // NOT DI ATAS PARANADA
    // -------------------------------------------------

    else if (
        target.nama === "E4"
    ) {

        // E4 = spasi di atas garis

        garisBantu =
            [];

    }

    else if (
        target.nama === "F4"
    ) {

        // F4 = tepat pada garis bantu F

        garisBantu =
            [60];

    }

    else if (
        target.nama === "G4"
    ) {

        // G4 = spasi di atas F

        garisBantu =
            [60];

    }

    else if (
        target.nama === "A4"
    ) {

        // A4 = tepat pada garis bantu A
        // dengan 1 garis bantu atas

        garisBantu =
            [30];

    }


    // =================================================
    // GAMBAR GARIS BANTU
    // =================================================

    garisBantu.forEach(
        function(gy) {

            ctx.beginPath();

            ctx.moveTo(
                x - 35,
                gy
            );

            ctx.lineTo(
                x + 35,
                gy
            );


            ctx.strokeStyle =
                "black";

            ctx.lineWidth =
                3;

            ctx.stroke();

        }
    );


    // =================================================
    // KEPALA NOT
    // =================================================

    ctx.beginPath();


    ctx.ellipse(
        x,
        y,
        17,
        12,
        -0.3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    // =================================================
    // BATANG NOT
    // =================================================

    ctx.beginPath();


    ctx.moveTo(
        x + 15,
        y
    );


    ctx.lineTo(
        x + 15,
        y - 75
    );


    ctx.lineWidth =
        4;

    ctx.stroke();

}


// =====================================================
// AUDIO
// =====================================================

let audioContext;

let analyser;

let microphone;

let buffer;


async function mulaiMikrofon() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        microphone =
            audioContext
            .createMediaStreamSource(
                stream
            );


        analyser =
            audioContext
            .createAnalyser();


        analyser.fftSize =
            4096;


        microphone.connect(
            analyser
        );


        buffer =
            new Float32Array(
                analyser.fftSize
            );


        deteksiNada();

    }

    catch (error) {

        console.log(error);


        document.body.innerHTML =
            "<h2>Izinkan akses mikrofon</h2>";

    }

}


// =====================================================
// DETEKSI NADA
// =====================================================

function deteksiNada() {

    analyser.getFloatTimeDomainData(
        buffer
    );


    const frekuensi =
        cariFrekuensi(
            buffer,
            audioContext.sampleRate
        );


    if (
        frekuensi > 0
    ) {

        cekNada(
            frekuensi
        );

    }


    requestAnimationFrame(
        deteksiNada
    );

}


// =====================================================
// CARI FREKUENSI
// =====================================================

function cariFrekuensi(
    buffer,
    sampleRate
) {

    let rms = 0;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];

    }


    rms =
        Math.sqrt(
            rms /
            buffer.length
        );


    if (
        rms < 0.015
    ) {

        return -1;

    }


    let bestOffset =
        -1;

    let bestCorrelation =
        0;


    for (
        let offset = 20;
        offset < 1000;
        offset++
    ) {

        let correlation =
            0;


        for (
            let i = 0;
            i < buffer.length - offset;
            i++
        ) {

            correlation +=
                buffer[i] *
                buffer[i + offset];

        }


        correlation /=
            buffer.length - offset;


        if (
            correlation >
            bestCorrelation
        ) {

            bestCorrelation =
                correlation;

            bestOffset =
                offset;

        }

    }


    if (
        bestOffset === -1
    ) {

        return -1;

    }


    return (
        sampleRate /
        bestOffset
    );

}


// =====================================================
// CEK NADA
// =====================================================

let waktuTerakhir =
    0;


function cekNada(freq) {

    const sekarang =
        Date.now();


    // Mencegah satu petikan
    // terbaca berkali-kali

    if (
        sekarang -
        waktuTerakhir <
        500
    ) {

        return;

    }


    let terdekat =
        null;

    let selisihTerkecil =
        Infinity;


    for (
        const n of nada
    ) {

        const selisih =
            Math.abs(
                freq -
                n.frekuensi
            );


        if (
            selisih <
            selisihTerkecil
        ) {

            selisihTerkecil =
                selisih;

            terdekat =
                n;

        }

    }


    // =================================================
    // TOLERANSI 2,5%
    // =================================================

    if (
        terdekat &&
        selisihTerkecil /
        terdekat.frekuensi <
        0.025
    ) {

        waktuTerakhir =
            sekarang;


        // -----------------------------
        // JIKA BENAR
        // -----------------------------

        if (
            terdekat.nama ===
            target.nama
        ) {

            pilihNot();

        }


        // -----------------------------
        // JIKA SALAH
        // -----------------------------

        else {

            // Not tetap ditampilkan.

        }

    }

}


// =====================================================
// MULAI OTOMATIS
// =====================================================

pilihNot();

mulaiMikrofon();

</script>

</body>
</html>
